<aside class="panel">
  <div class="timer" [class.idle]="!running" [class.low]="low" role="timer" [attr.aria-label]="seconds + ' seconds left'">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="timer-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d8ff6e" />
          <stop offset="1" stop-color="#3ee6b0" />
        </linearGradient>
      </defs>
      <circle class="track" cx="60" cy="60" r="52" />
      <circle
        class="arc"
        cx="60"
        cy="60"
        r="52"
        pathLength="100"
        stroke-dasharray="100"
        [attr.stroke-dashoffset]="100 - remaining"
      />
    </svg>
    <div class="timer-label">
      <strong>{{ seconds }}</strong>
      <small>{{ running ? 'seconds' : 'ready' }}</small>
    </div>
  </div>

  <div class="lives" [attr.aria-label]="lives + ' of ' + maxLives + ' lives left'">
    <span class="label">Lives</span>
    <div class="hearts">
      @for (alive of hearts; track $index) {
        <svg viewBox="0 0 24 24" [class.lost]="!alive" aria-hidden="true">
          <path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" />
        </svg>
      }
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="label">Level</span>
      <span class="value">{{ level }}</span>
    </div>
    <div class="stat">
      <span class="label">Score</span>
      <span class="value accent">{{ score | number }}</span>
    </div>
    <div class="stat wide">
      <span class="label">Best</span>
      <span class="value">{{ best | number }}</span>
    </div>
  </div>
</aside>
